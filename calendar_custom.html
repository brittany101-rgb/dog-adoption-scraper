        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            const isMobile = window.innerWidth < 768;
            
            const events = EVENTS_DATA.map(event => {
                let color = '#df6e06';
                if (event.title.includes('[Rocket Dog]')) color = '#547380';
                else if (event.title.includes('[Muttville]')) color = '#f4a300';
                else if (event.title.includes('[Marin Humane]')) color = '#df6e06';
                else if (event.title.includes('[Family Dog]')) color = '#6b7280';
                else if (event.title.includes('[NorSled]')) color = '#2c3e50';
                else if (event.title.includes('[Berkeley Humane]')) color = '#16a085';
                else if (event.title.includes('[Joybound]')) color = '#b7410e';
                else if (event.title.includes('[DPS Rescue]')) color = '#2d5f3d';
                
                return {
                    title: event.title,
                    start: event.start_datetime,
                    end: event.end_datetime,
                    url: event.source_url,
                    backgroundColor: color,
                    borderColor: color,
                    textColor: '#ffffff'
                };
            });
            
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: isMobile ? 'listMonth' : 'dayGridMonth',
                initialDate: new Date(),
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,listMonth'
                },
                events: events,
                eventClick: function(info) {
                    info.jsEvent.preventDefault();
                    if (info.event.url) window.open(info.event.url, '_blank');
                },
                displayEventTime: true,
                eventTimeFormat: { hour: 'numeric', minute: '2-digit', meridiem: 'short' },
                height: 'auto',
                dayMaxEvents: false,
                fixedWeekCount: false,
                showNonCurrentDates: false,
                eventDidMount: function(info) {
                    if (info.view.type === 'dayGridMonth') {
                        info.el.style.backgroundColor = info.event.backgroundColor;
                        info.el.style.borderColor = info.event.borderColor;
                        info.el.style.color = '#ffffff';
                    }
                }
            });
            
            calendar.render();
        });
    </script>
